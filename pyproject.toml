[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtfb"
version = "0.1.0"
description = "Get The F*** to Bed - Anti-distraction bedtime automation tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.2.2",
]

[project.scripts]
gtfb = "gtfb.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfb"]
