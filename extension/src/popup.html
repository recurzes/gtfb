<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTFB Suite</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="GTFB" class="logo">
        <div class="brand-text">
          <span class="logo-title">GTFB Suite</span>
          <span class="subtitle">Anti-Distraction Control</span>
        </div>
      </div>
      <span id="syncStatus" class="status-indicator standalone">Standalone</span>
    </header>

    <!-- Main Toggle Control Card -->
    <div class="main-control" id="mainControlCard">
      <div class="info">
        <div class="status-text" id="statusLabel">Blocking Active</div>
        <div class="subtext" id="statusDetail">Distracting sites blocked</div>
      </div>
      <label class="switch" for="blockingToggle" title="Toggle site blocking">
        <input type="checkbox" id="blockingToggle" checked aria-label="Toggle site blocking">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Active Lock Session Banner (hidden by default, shown when locked) -->
    <div class="lock-banner hidden" id="lockBanner">
      <div class="lock-banner-header">
        <div class="lock-icon-badge">
          <svg class="lock-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="lock-info">
          <span class="lock-title">Focus Lock Active</span>
          <span class="lock-subtitle">Unlocking disabled until timer ends</span>
        </div>
      </div>
      <div class="lock-countdown-display" id="lockCountdown">25:00</div>
    </div>

    <!-- Focus Lock Setup Section -->
    <div class="focus-section" id="focusSection">
      <div class="section-title-row">
        <span class="section-title">Focus Lock Timer</span>
        <span class="section-badge">Unbypassable</span>
      </div>
      <p class="section-desc">Lock blocking ON. Cannot be toggled off until the countdown expires.</p>

      <div class="preset-chips" id="presetChips">
        <button type="button" class="chip" data-mins="15">15m</button>
        <button type="button" class="chip active" data-mins="25">25m</button>
        <button type="button" class="chip" data-mins="45">45m</button>
        <button type="button" class="chip" data-mins="60">60m</button>
      </div>

      <button type="button" class="btn-start-lock" id="startLockBtn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Start 25m Focus Lock
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span id="domainCount">5 domains configured</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
